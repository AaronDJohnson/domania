[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "domainia"
version = "3.0.0"
description = "Translate data arrays between time, frequency and WDM, and evaluate a noise model's per-point K x K covariance on a frequency or WDM grid."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Johnson" }]
classifiers = ["Typing :: Typed"]
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/domainia"]

[tool.hatch.build.targets.sdist]
# Only the package and its tests: the specs and plans under docs/ and any untracked folder at
# the root stay out. hatchling adds README.md, LICENSE, pyproject.toml, .gitignore and PKG-INFO.
only-include = ["src", "tests"]

[tool.pytest.ini_options]
# One config for the whole repo.  tests/ has no __init__.py; tests/wilson is a package
# whose conftest puts tests/wilson/oracle on sys.path.  --doctest-modules applies to every collected
# path (tests/ too); the doctests themselves live only in domainia.wilson.
testpaths = ["tests", "src/domainia/wilson"]
pythonpath = ["src"]
addopts = "-ra --doctest-modules -p no:cacheprovider"
norecursedirs = [".*", "__pycache__", "oracle", "data"]
xfail_strict = true

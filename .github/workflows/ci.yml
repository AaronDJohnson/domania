name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported versions, as pyproject.toml's lower bounds state them.
          - { python: "3.12", label: "numpy 2.1.0, scipy 1.14.1", pins: "numpy==2.1.0 scipy==1.14.1" }
          - { python: "3.12", label: "latest", pins: "" }
          - { python: "3.13", label: "latest", pins: "" }
          - { python: "3.14", label: "latest", pins: "" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ${{ matrix.pins }} ".[test]"
      # pytest imports domania from src/ (pythonpath in pyproject.toml). The three oracle tests
      # skip, since DOMANIA_ORACLE_ROOT is not set here.
      - name: Test
        run: python -P -m pytest -q -W error
